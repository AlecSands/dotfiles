# Clear status line and show only task
set -g status-left ""
set -g status-right ""
set -g status-justify centre
set -g status-style bg=colour235,fg=colour255

# Display third line from notes file
set -g status-interval 1
set -g window-status-format ""
set -g window-status-current-format "#(sed -n '3p' ~/Code/notes.md 2>/dev/null | sed 's/^- \\[ \\] //' || echo 'No task set')"
